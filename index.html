<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HE3AM Music</title>

  <!-- Main stylesheet -->
  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- Audius SDK -->
  
  </script>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="topbar">

    <div class="brand">
      <div class="brand-logo">♫</div>

      <div>
        <h1>HE3AM</h1>
        <span>Music</span>
      </div>
    </div>

    <div class="header-actions">

      <button
        id="themeBtn"
        class="icon-btn"
        title="Theme"
      >
        ☀️
      </button>

      <button
        id="backupBtn"
        class="icon-btn"
        title="Backup"
      >
        💾
      </button>

      <button
        id="importBtn"
        class="icon-btn"
        title="Import"
      >
        📂
      </button>

      <input
        id="fileInput"
        type="file"
        accept=".json,application/json"
        hidden
      >

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main class="container">

    <!-- Search -->

    <section class="search-section">

      <div class="search-box">

        <span class="search-icon">
          🔎
        </span>

        <input
          id="search"
          type="search"
          placeholder="Search songs, artists or playlists..."
          autocomplete="off"
        >

        <button
          id="onlineSearchBtn"
          type="button"
        >
          Search
        </button>

      </div>

    </section>


    <!-- =========================
         STATS
    ========================== -->

    <section class="stats">

      <div class="stat-card">
        <span>Playlists</span>
        <strong id="playlistCount">0</strong>
      </div>

      <div class="stat-card">
        <span>Tracks</span>
        <strong id="trackCount">0</strong>
      </div>

      <div class="stat-card">
        <span>Favorites</span>
        <strong id="favoriteCount">0</strong>
      </div>

    </section>


    <!-- =========================
         ACTIONS
    ========================== -->

    <section class="actions">

      <button
        id="newPlaylistBtn"
        class="primary-btn"
        type="button"
      >
        ＋ New Playlist
      </button>

      <button
        id="addTrackBtn"
        class="secondary-btn"
        type="button"
      >
        ＋ Add Track
      </button>

    </section>


    <!-- =========================
         ONLINE MUSIC
    ========================== -->

    <section
      id="onlineSection"
      class="online-section hidden"
    >

      <div class="section-header">

        <div>
          <h2>Online Music</h2>

          <p id="onlineStatus">
            Search Audius
          </p>
        </div>

        <button
          id="closeOnlineBtn"
          class="close-btn"
          type="button"
          title="Close"
        >
          ×
        </button>

      </div>


      <div
        id="onlineResults"
        class="online-results"
      ></div>

    </section>


    <!-- =========================
         PLAYLISTS
    ========================== -->

    <section class="playlist-section">

      <div class="section-header">

        <div>
          <h2>Your Playlists</h2>
          <p>Manage your music collection</p>
        </div>

      </div>


      <div
        id="playlistGrid"
        class="playlist-grid"
      ></div>


      <div
        id="empty"
        class="empty"
      >

        <div class="empty-icon">
          ♫
        </div>

        <h3>No playlists yet</h3>

        <p>
          Create your first playlist to start
          building your music collection.
        </p>

        <button
          type="button"
          class="primary-btn"
          onclick="openPlaylistModal()"
        >
          ＋ Create Playlist
        </button>

      </div>

    </section>

  </main>


  <!-- =========================
       PLAYER
  ========================== -->

  <footer class="player">

    <div class="player-track">

      <div
        id="playerCover"
        class="player-cover"
      >
        ♪
      </div>

      <div class="player-info">

        <strong id="playerTitle">
          Nothing playing
        </strong>

        <span id="playerArtist">
          Select a song
        </span>

      </div>

    </div>


    <div class="player-controls">

      <div class="player-buttons">

        <button
          id="prevBtn"
          type="button"
          title="Previous"
        >
          ⏮
        </button>

        <button
          id="playBtn"
          type="button"
          class="play-btn"
          title="Play"
        >
          ▶
        </button>

        <button
          id="nextBtn"
          type="button"
          title="Next"
        >
          ⏭
        </button>

      </div>


      <div class="progress-container">

        <span id="time">
          0:00
        </span>

        <input
          id="progress"
          type="range"
          min="0"
          max="100"
          value="0"
        >

        <span id="duration">
          0:00
        </span>

      </div>

    </div>

  </footer>


  <!-- =========================
       PLAYLIST MODAL
  ========================== -->

  <dialog id="playlistModal">

    <form
      id="playlistForm"
      method="dialog"
      class="modal"
    >

      <div class="modal-header">

        <h2>Create Playlist</h2>

        <button
          type="button"
          class="close-btn"
          onclick="document.getElementById('playlistModal').close()"
        >
          ×
        </button>

      </div>


      <label for="playlistName">
        Playlist name
      </label>

      <input
        id="playlistName"
        type="text"
        placeholder="My Playlist"
        required
      >


      <label for="playlistDescription">
        Description
      </label>

      <textarea
        id="playlistDescription"
        placeholder="A collection of my favorite songs..."
      ></textarea>


      <div class="modal-actions">

        <button
          type="button"
          class="secondary-btn"
          onclick="document.getElementById('playlistModal').close()"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="primary-btn"
        >
          Create
        </button>

      </div>

    </form>

  </dialog>


  <!-- =========================
       TRACK MODAL
  ========================== -->

  <dialog id="trackModal">

    <form
      id="trackForm"
      method="dialog"
      class="modal"
    >

      <div class="modal-header">

        <h2>Add Track</h2>

        <button
          type="button"
          class="close-btn"
          onclick="document.getElementById('trackModal').close()"
        >
          ×
        </button>

      </div>


      <label for="trackPlaylist">
        Playlist
      </label>

      <select id="trackPlaylist"></select>


      <label for="trackTitle">
        Song title
      </label>

      <input
        id="trackTitle"
        type="text"
        placeholder="Song title"
        required
      >


      <label for="trackArtist">
        Artist
      </label>

      <input
        id="trackArtist"
        type="text"
        placeholder="Artist"
      >


      <label for="trackUrl">
        Audio URL
      </label>

      <input
        id="trackUrl"
        type="url"
        placeholder="https://..."
      >


      <div class="modal-actions">

        <button
          type="button"
          class="secondary-btn"
          onclick="document.getElementById('trackModal').close()"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="primary-btn"
        >
          Add Track
        </button>

      </div>

    </form>

  </dialog>


  <!-- =========================
       PLAYLIST TEMPLATE
  ========================== -->

  <template id="playlistTemplate">

    <article class="playlist-card">

      <div class="playlist-card-header">

        <div>
          <h3></h3>

          <p></p>
        </div>

        <button
          class="more"
          type="button"
          title="Delete playlist"
        >
          ⋮
        </button>

      </div>


      <div class="playlist-meta">

        <span class="track-count">
          0 tracks
        </span>

      </div>


      <div class="tracks"></div>


      <button
        class="open"
        type="button"
      >
        Open Playlist
      </button>

    </article>

  </template>


  <!-- =========================
       APP JS
  ========================== -->

  <script src="app.js"></script>

</body>
</html>
