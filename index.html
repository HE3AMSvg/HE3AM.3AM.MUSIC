<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pulse Music</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f8;
      color: #111;
      padding-bottom: 110px;
    }

    body.dark {
      background: #111;
      color: #fff;
    }

    header {
      padding: 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      border: 0;
      cursor: pointer;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
    }

    #search {
      width: min(600px, 90vw);
      padding: 15px 18px;
      border-radius: 14px;
      border: 1px solid #ddd;
      font-size: 16px;
      outline: none;
    }

    body.dark #search {
      background: #1d1d1d;
      color: white;
      border-color: #333;
    }

    .search-area {
      display: flex;
      justify-content: center;
      padding: 10px 20px 30px;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      padding: 10px 20px 30px;
    }

    .stat {
      background: white;
      border-radius: 14px;
      padding: 15px 25px;
      min-width: 130px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    body.dark .stat {
      background: #1c1c1c;
    }

    .stat b {
      display: block;
      font-size: 22px;
    }

    .stat span {
      opacity: .65;
      font-size: 13px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .primary {
      background: #111;
      color: white;
    }

    body.dark .primary {
      background: white;
      color: black;
    }

    .playlist-grid {
      width: min(1100px, 94vw);
      margin: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }

    .playlist-card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,.06);
    }

    body.dark .playlist-card {
      background: #1c1c1c;
    }

    .playlist-card h3 {
      margin: 0 0 6px;
    }

    .playlist-card p {
      opacity: .65;
    }

    .tracks {
      margin-top: 15px;
    }

    .track {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    body.dark .track {
      border-color: #333;
    }

    .track small {
      opacity: .6;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .empty {
      text-align: center;
      opacity: .55;
      padding: 50px 20px;
    }

    /* ONLINE AUDIO RESULTS */

    #onlineSection {
      width: min(900px, 94vw);
      margin: 10px auto 35px;
    }

    #onlineSection.hidden {
      display: none;
    }

    .online-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 10px;
    }

    .online-header h2 {
      margin: 0;
    }

    #onlineStatus {
      opacity: .6;
      font-size: 14px;
      margin-bottom: 12px;
    }

    #onlineResults {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .online-track {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border-radius: 15px;
      background: white;
      box-shadow: 0 4px 18px rgba(0,0,0,.05);
    }

    body.dark .online-track {
      background: #1c1c1c;
    }

    .online-cover {
      width: 58px;
      height: 58px;
      min-width: 58px;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eee;
      font-size: 25px;
    }

    body.dark .online-cover {
      background: #292929;
    }

    .online-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .online-info {
      flex: 1;
      min-width: 0;
    }

    .online-info b {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .online-info span {
      display: block;
      opacity: .6;
      margin-top: 5px;
      font-size: 14px;
    }

    .online-actions {
      display: flex;
      gap: 7px;
    }

    .online-play {
      background: #111;
      color: white;
    }

    body.dark .online-play {
      background: white;
      color: black;
    }

    /* PLAYER */

    #player {
      position: fixed;
      left: 15px;
      right: 15px;
      bottom: 15px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 35px rgba(0,0,0,.18);
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
    }

    body.dark #player {
      background: #1c1c1c;
    }

    #playerCover {
      width: 55px;
      height: 55px;
      border-radius: 10px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    body.dark #playerCover {
      background: #292929;
    }

    .player-info {
      width: 180px;
      min-width: 0;
    }

    #playerTitle,
    #playerArtist {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #playerTitle {
      font-weight: bold;
    }

    #playerArtist {
      opacity: .6;
      font-size: 13px;
      margin-top: 4px;
    }

    .player-controls {
      display: flex;
      gap: 7px;
    }

    .player-progress {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #progress {
      width: 100%;
    }

    .time {
      font-size: 12px;
      opacity: .6;
      white-space: nowrap;
    }

    /* DIALOG */

    dialog {
      border: 0;
      border-radius: 18px;
      padding: 25px;
      width: min(450px, 90vw);
    }

    dialog::backdrop {
      background: rgba(0,0,0,.55);
    }

    dialog form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    dialog input,
    dialog textarea,
    dialog select {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    .dialog-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 5px;
    }

    @media (max-width: 700px) {

      #player {
        flex-wrap: wrap;
      }

      .player-info {
        flex: 1;
        width: auto;
      }

      .player-progress {
        width: 100%;
        flex-basis: 100%;
      }

      .online-track {
        padding: 9px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>

    <div class="logo">
      🎵 Pulse Music
    </div>

    <div class="header-actions">

      <button id="themeBtn">
        ☀️
      </button>

    </div>

  </header>


  <!-- SEARCH -->

  <div class="search-area">

    <input
      id="search"
      type="search"
      placeholder="Search songs, artists or playlists..."
      autocomplete="off"
    >

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      <b id="playlistCount">0</b>
      <span>Playlists</span>
    </div>

    <div class="stat">
      <b id="trackCount">0</b>
      <span>Tracks</span>
    </div>

    <div class="stat">
      <b id="favoriteCount">0</b>
      <span>Favorites</span>
    </div>

  </div>


  <!-- ACTIONS -->

  <div class="actions">

    <button
      id="newPlaylistBtn"
      class="primary"
    >
      + New Playlist
    </button>

    <button id="addTrackBtn">
      + Add Track
    </button>

    <button id="backupBtn">
      Backup
    </button>

    <button id="importBtn">
      Import
    </button>

    <input
      id="fileInput"
      type="file"
      accept="application/json"
      hidden
    >

  </div>


  <!-- AUDIUS RESULTS -->

  <section
    id="onlineSection"
    class="hidden"
  >

    <div class="online-header">

      <div>

        <h2>Online Music</h2>

        <div id="onlineStatus">
          Search Audius music
        </div>

      </div>

      <div>

        <button id="onlineSearchBtn">
          Search
        </button>

        <button id="closeOnlineBtn">
          ×
        </button>

      </div>

    </div>

    <div id="onlineResults"></div>

  </section>


  <!-- PLAYLISTS -->

  <main>

    <div
      id="playlistGrid"
      class="playlist-grid"
    ></div>

    <div
      id="empty"
      class="empty"
    >
      No playlists yet.
      <br>
      Create your first playlist.
    </div>

  </main>


  <!-- PLAYLIST TEMPLATE -->

  <template id="playlistTemplate">

    <article class="playlist-card">

      <h3></h3>

      <p></p>

      <span class="track-count">
        0 tracks
      </span>

      <div class="tracks"></div>

      <div class="card-actions">

        <button class="open">
          Add Track
        </button>

        <button class="more">
          Delete
        </button>

      </div>

    </article>

  </template>


  <!-- PLAYER -->

  <div id="player">

    <div id="playerCover">
      ♪
    </div>

    <div class="player-info">

      <div id="playerTitle">
        Nothing playing
      </div>

      <div id="playerArtist">
        Select a song
      </div>

    </div>

    <div class="player-controls">

      <button id="prevBtn">
        ⏮
      </button>

      <button id="playBtn">
        ▶
      </button>

      <button id="nextBtn">
        ⏭
      </button>

    </div>

    <div class="player-progress">

      <span
        id="time"
        class="time"
      >
        0:00
      </span>

      <input
        id="progress"
        type="range"
        min="0"
        max="100"
        value="0"
      >

      <span
        id="duration"
        class="time"
      >
        0:00
      </span>

    </div>

  </div>


  <!-- NEW PLAYLIST MODAL -->

  <dialog id="playlistModal">

    <form id="playlistForm">

      <h2>
        New Playlist
      </h2>

      <input
        id="playlistName"
        placeholder="Playlist name"
        required
      >

      <textarea
        id="playlistDescription"
        placeholder="Description"
        rows="4"
      ></textarea>

      <div class="dialog-buttons">

        <button
          type="button"
          onclick="this.closest('dialog').close()"
        >
          Cancel
        </button>

        <button
          class="primary"
          type="submit"
        >
          Create
        </button>

      </div>

    </form>

  </dialog>


  <!-- ADD TRACK MODAL -->

  <dialog id="trackModal">

    <form id="trackForm">

      <h2>
        Add Track
      </h2>

      <select id="trackPlaylist"></select>

      <input
        id="trackTitle"
        placeholder="Track title"
        required
      >

      <input
        id="trackArtist"
        placeholder="Artist"
      >

      <input
        id="trackUrl"
        placeholder="Audio URL"
        type="url"
      >

      <div class="dialog-buttons">

        <button
          type="button"
          onclick="this.closest('dialog').close()"
        >
          Cancel
        </button>

        <button
          class="primary"
          type="submit"
        >
          Add
        </button>

      </div>

    </form>

  </dialog>


  <script src="app.js"></script>

</body>
</html>
