<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HE3AM.3AM.MUSIC</title>

  <link rel="stylesheet" href="style.css">
</head>

<body data-theme="dark">

  <!-- =========================
       HEADER
       ========================= -->

  <header class="header">
    <div class="container header-inner">

      <div class="logo">
        <span>HE3AM</span>.3AM.MUSIC
      </div>

      <button
        id="themeToggle"
        type="button"
        title="Toggle theme"
      >
        ☀
      </button>

    </div>
  </header>


  <!-- =========================
       MAIN
       ========================= -->

  <main>

    <div class="container">

      <!-- HERO -->

      <section class="hero">

        <h1>
          HE3AM<span>.MUSIC</span>
        </h1>

        <p>
          Search, discover and play your favorite music.
        </p>


        <!-- SEARCH -->

        <div class="search-box">

          <input
            id="searchInput"
            type="search"
            placeholder="Search songs or artists..."
            autocomplete="off"
          >

          <button
            id="searchButton"
            type="button"
          >
            🔎
          </button>

        </div>


        <!-- STATS -->

        <div class="stats">

          <div class="stat">
            <strong id="playlistCount">0</strong>
            <span>Playlists</span>
          </div>

          <div class="stat">
            <strong id="trackCount">0</strong>
            <span>Tracks</span>
          </div>

          <div class="stat">
            <strong>∞</strong>
            <span>Music</span>
          </div>

        </div>

      </section>


      <!-- =========================
           ACTIONS
           ========================= -->

      <section>

        <div class="actions">

          <button
            id="newPlaylistBtn"
            class="primary"
            type="button"
          >
            + New Playlist
          </button>

          <button
            id="exportBtn"
            type="button"
          >
            Export
          </button>

          <button
            id="importBtn"
            type="button"
          >
            Import
          </button>

          <input
            id="importFile"
            type="file"
            accept=".json,application/json"
            hidden
          >

        </div>

      </section>


      <!-- =========================
           ONLINE MUSIC
           ========================= -->

      <section
        id="onlineSection"
        class="hidden"
      >

        <div class="section-header">

          <div>
            <h2>Online Music</h2>
            <p id="onlineStatus">
              Search results will appear here.
            </p>
          </div>

        </div>

        <div id="onlineResults"></div>

      </section>


      <!-- =========================
           PLAYLISTS
           ========================= -->

      <section>

        <div class="section-header">

          <div>
            <h2>Your Playlists</h2>
            <p>
              Manage your music collection.
            </p>
          </div>

        </div>

        <div id="playlistGrid"></div>

      </section>


      <!-- =========================
           CURRENT PLAYLIST
           ========================= -->

      <section>

        <div id="currentPlaylist"></div>

      </section>

    </div>

  </main>


  <!-- =========================
       PLAYER
       ========================= -->

  <div
    id="player"
    class="music-player"
  >

    <div class="player-inner">

      <img
        id="playerCover"
        class="player-cover"
        src="https://via.placeholder.com/500?text=HE3AM"
        alt="Current track"
      >

      <div class="player-info">

        <div
          id="playerTitle"
          class="player-title"
        >
          Nothing playing
        </div>

        <div
          id="playerArtist"
          class="player-artist"
        >
          HE3AM
        </div>

      </div>


      <div class="player-controls">

        <button
          id="playPauseBtn"
          type="button"
        >
          ▶
        </button>

      </div>


      <div class="player-progress">

        <span id="currentTime">
          0:00
        </span>

        <input
          id="progressBar"
          type="range"
          min="0"
          max="100"
          value="0"
        >

        <span id="duration">
          0:00
        </span>

      </div>

    </div>

  </div>


  <!-- =========================
       PLAYLIST DIALOG
       ========================= -->

  <dialog id="playlistDialog">

    <h2>
      Create Playlist
    </h2>

    <form id="playlistForm">

      <input
        id="playlistName"
        type="text"
        placeholder="Playlist name..."
        maxlength="50"
        required
        autocomplete="off"
      >

      <div class="dialog-actions">

        <button
          id="cancelPlaylistBtn"
          type="button"
        >
          Cancel
        </button>

        <button
          class="primary"
          type="submit"
        >
          Create
        </button>

      </div>

    </form>

  </dialog>


  <!-- =========================
       APP
       ========================= -->

  <script src="app.js"></script>

</body>
</html>
